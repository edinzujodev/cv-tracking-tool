<!doctype html>
<meta charset="utf-8">
<title>ATS check harness</title>
<!-- Dev-only page: renders a template with sample data and runs the read-back check
     in a real browser. Driven by a script that prints the page to PDF. Serve the
     project root over http and open test/browser-harness.html?t=<template id>. -->
<style>body { margin: 0; padding: 0.6in; background: #fff; }</style>
<div id="page"></div>
<script type="module">
import { getTemplate } from '../src/templates/index.js';
import { emptyProfile } from '../src/model.js';
import { checkReadBack } from '../src/ats/check.js';
import { itemsFromDom, itemsFromPdf } from '../src/ats/reader.js';
import * as pdfjs from '../vendor/pdf.min.mjs';

pdfjs.GlobalWorkerOptions.workerSrc = '../vendor/pdf.worker.min.mjs';

const profile = {
  ...emptyProfile(),
  name: 'JANE EXAMPLE', headline: 'Engineering Lead · Node.js',
  email: 'jane@example.com', phone: '+1 555 010 0100', location: 'Springfield, Exampleland',
  links: [{ label: 'LinkedIn', url: 'linkedin.com/in/jane-example' }],
  summary: 'Engineering lead with ten years turning business problems into working products. Leads teams of up to ten as architect, hands-on developer and mentor, and works directly with leadership to deliver reliably.',
  experience: [
    { title: 'Senior Full-Stack Engineer', company: 'Acme Co', location: 'Berlin', start: '08/2024', end: 'Present',
      description: 'Built the energy platform for controlling devices, then the mobile apps with native push notifications. Integrated authentication, caching and deployments on a managed cloud with automated tests.\nBuilt automation pipelines for the marketing and finance departments, reducing manual workload by more than half.' },
    { title: 'Technical Lead', company: 'Globex', location: 'Paris', start: '04/2023', end: '08/2024',
      description: 'Managed a team of five engineers on a microservices project and introduced agile practices for the whole team.' },
    { title: 'Frontend Engineer', company: 'Initech', location: 'Austin', start: '03/2022', end: '03/2023',
      description: 'Upgraded an e-commerce platform and built a 3D shopping experience.' },
  ],
  education: [
    { school: 'Example University', degree: 'Master of Business Administration (MBA)', start: '2010', end: '2011' },
    { school: 'Sample College', degree: 'BSc in Computer Science', start: '2006', end: '2010' },
  ],
  skillGroups: [
    { name: 'Languages', items: ['TypeScript', 'JavaScript', 'Python', 'Go'] },
    { name: 'Cloud & DevOps', items: ['Docker', 'GitLab CI', 'Google Cloud'] },
    { name: 'Database', items: ['PostgreSQL', 'Redis', 'Elasticsearch'] },
  ],
  awards: [{ title: 'Most Valued Employee Award', issuer: 'Acme Co', date: '' }],
  projects: [{ name: 'Network ad blocker', description: 'A small DNS server that answers ad domains and forwards the rest.' }],
  volunteering: [{ role: 'Founder and Volunteer', organization: 'Example Charity', start: '2011', end: '2020', description: '' }],
};

const id = new URLSearchParams(location.search).get('t');
document.getElementById('page').innerHTML = getTemplate(id).render(profile);
await document.fonts.ready;

// Called by the driver script with the printed PDF.
window.run = async (pdfBase64) => {
  const dom = checkReadBack(profile, itemsFromDom(document.getElementById('page')));
  const bytes = Uint8Array.from(atob(pdfBase64), (c) => c.charCodeAt(0));
  const pdf = checkReadBack(profile, await itemsFromPdf(bytes, pdfjs));
  const bad = (r) => r.results.filter((x) => x.status !== 'pass').map((x) => `${x.status}: ${x.label} ${x.detail}`);
  return { dom: dom.score, pdf: pdf.score, domIssues: bad(dom), pdfIssues: bad(pdf) };
};
window.ready = true;
</script>
