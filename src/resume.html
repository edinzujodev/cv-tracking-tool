<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume</title>
  <link rel="stylesheet" href="../vendor/pico.min.css">
  <style>
    .toolbar { display: flex; gap: 1rem; justify-content: flex-end; padding: 1rem; }
    .toolbar button, .toolbar label { margin: 0; width: auto; }
    #check { max-width: 8.5in; margin: 0 auto 1rem; padding: 0 1rem; }
    #check h3 { font-size: 1rem; margin-bottom: 0.25rem; }
    #check ul { list-style: none; padding: 0; margin: 0.5rem 0 0; }
    #check li { display: flex; gap: 0.5rem; padding: 0.15rem 0; font-size: 0.875rem; }
    #check .badge { flex: none; width: 3.2rem; text-align: center; font-weight: 600; }
    #check .pass { color: var(--pico-ins-color); }
    #check .warn { color: #8a5a00; }
    #check .fail { color: var(--pico-del-color); }
    #check small { color: var(--pico-muted-color); }
    #page { background: #fff; color: #000; padding: 0.75in; max-width: 8.5in; margin: 0 auto 2rem; box-shadow: 0 0 0 1px #ddd; }
    @media print {
      .toolbar, #check { display: none; }
      body { background: #fff; }
      #page { padding: 0; box-shadow: none; max-width: none; margin: 0; }
      @page { margin: 0.6in; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="pdf" role="button" class="secondary outline">Check a saved PDF</label>
    <input id="pdf" type="file" accept="application/pdf" hidden>
    <button id="print">Save as PDF</button>
  </div>
  <section id="check" aria-live="polite"></section>
  <div id="page"></div>
  <script type="module" src="resume.js"></script>
</body>
</html>
